

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aldin's Study Hub</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            background: #1e293b;
            padding: 35px;
            border-radius: 12px;
            width: 300px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: none;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h1>Aldin's Study Hub</h1>
        <p>Welcome! Sign in to access your learning space.</p>

        <form>
            <input type="text" placeholder="Enter username">
            <input type="password" placeholder="Enter password">
            <button type="button" onclick="window.location.href='dashboard.html'">
    Login
</button>
        </form>
    </div>

</body>
</html>
<title>Aldin's Study Hub</title>
<link rel="stylesheet" href="style.css">
